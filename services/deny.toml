# Resolved Rust dependency policy. `cargo deny --locked --all-features check` is the
# executable contract; changing this allow-list is a review event, not a way to silence CI.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The two unpublished workspace binaries are proprietary application code. Their
# distribution license is a product/legal decision and must not be invented here.
ignore = true

[bans]
# Duplicates stay VISIBLE as upgrade debt, and `skip` below stays empty on purpose. A skipped
# duplicate is one nobody looks at again, which defeats the only thing this setting buys.
#
# The legacy mediasoup graph resolves several parallel majors and cannot be collapsed independently
# of upstream. That was written as if it were the whole story; it is not, and the next person to read
# a warning here should not have to re-derive the rest. Measured 2026-08-15 with
# `cargo tree --workspace -i`:
#
#   crypto-common 0.2.2  <- digest 0.11.3  <- hmac / hkdf / md-5  <- sqlx-postgres 0.9.0
#   crypto-common 0.1.7  <- digest 0.10.7  <- blake2   <- argon2 0.5.3
#                                          <- curve25519-dalek <- ed25519-dalek 2.x
#
# Both roots are OUR direct dependencies, not mediasoup — so this one looks collapsible and is not.
# `argon2`'s only release carrying `digest 0.11` is `0.6.0-rc.8`, a RELEASE CANDIDATE of the crate
# that hashes passwords, and `ed25519-dalek 3.0.0` is a major bump of the crate that signs auth
# tokens. Taking either to silence a warning would trade a real risk for a cosmetic one, and
# upgrading `ed25519-dalek` alone would not even collapse it while `argon2 0.5.3` still pulls
# `digest 0.10`.
#
# So: `warn`, not `deny`, and no skip. Revisit when `argon2 0.6` ships stable.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
