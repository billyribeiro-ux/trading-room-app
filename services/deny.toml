# Resolved Rust dependency policy. `cargo deny --locked --all-features check` is the
# executable contract; changing this allow-list is a review event, not a way to silence CI.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The two unpublished workspace binaries are proprietary application code. Their
# distribution license is a product/legal decision and must not be invented here.
ignore = true

[bans]
# The legacy mediasoup graph resolves several parallel majors. Keep them visible as
# upgrade debt without pretending they can be collapsed independently of upstream.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
