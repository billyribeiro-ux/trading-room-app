[package]
name = "tradingroom-media"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# The official Rust port, same team as the Node implementation. Pinned to the release line the
# captured client's negotiation was checked against.
mediasoup = "0.24"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
# The type returned by mediasoup's `on_dead`; mediasoup does not re-export it, and the handler
# must be retained for the subscription to stay alive.
event-listener-primitives = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
url.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# A real WebSocket client for the service-surface tests, so they exercise the actual HTTP upgrade,
# the actual 401 and the actual frames rather than a `tower::Service` call. Already in the tree:
# axum's `ws` feature depends on this exact version.
tokio-tungstenite = "0.29"
