name: Frontend quality

# The gate the two applications never had.
#
# Until 2026-08-14 this repository ran exactly two workflows: `backend-quality.yml`, which gates
# Rust and skips itself when a revision does not touch `services/**`, and `smoke.yml`, which runs
# AFTER a deployment. Nothing ran lint, check, test or build for `apps/controller` or `apps/room` on
# a push or a pull request — and `main` auto-deploys, so a push is a production release.
#
# The absence was not merely untested, it was believed otherwise in writing: the controller's ESLint
# config ignored `apps/**` on the stated grounds that the room had "its own gate (the `room` job in
# `.github/workflows/quality.yml`)". This file is that job, created for the first time. What it
# would have caught, found by hand on the day it was written: the room had no ESLint at all, and a
# verification probe shipped a template literal terminated early by backticks inside a comment.

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on a BRANCH. Never on `main`.
#
# `cancel-in-progress: true` was unconditional here, and on a branch it is exactly right: pushing
# again makes the previous run irrelevant, and a slow job restarting from zero on every push means
# nothing is ever learned. On `main` it is the opposite, because a run on `main` is not a preview of
# a merge — it is the only verification a production deploy ever gets.
#
# What that cost, measured rather than argued. `060ba72` was pushed straight to `main`, broke the
# lint gate for every subsequent run, and its own verification run was CANCELLED when a PR merge
# landed two minutes later. The gate never checked the commit that broke it, and the next 8 runs
# failed for a reason nobody could attribute. Across the last 40 runs on `main`, 11 were `cancelled`
# — 27% — and that included EVERY `Backend quality` run in the 2026-08-15 sequence: 4a79203,
# c1ff436, 5f03e5f, 731d232, b267143, a84f20f, 41d8de6, ffa410d, 030a209, ed3b26f. The Rust and
# PostgreSQL security contracts on a multi-tenant fintech application were, in practice, unverified
# on the default branch.
#
# The expression evaluates to `false` only for `refs/heads/main`, so branch and pull_request runs
# keep cancelling as before and nothing gets slower except the default branch, which is the one
# place the answer matters more than the wall-clock.
#
# THE GROUP IS PER-COMMIT ON `main`, AND THAT SECOND HALF IS NOT DECORATION.
#
# `cancel-in-progress: false` alone was measured and found insufficient. It protects the run that is
# already EXECUTING, and that much worked — `34e6c09` started at 16:36:20Z and survived four
# subsequent pushes where every earlier backend run had been killed within minutes. But GitHub keeps
# only ONE pending run per concurrency group, so a newer arrival still cancels the QUEUED one. On
# 2026-08-15 the run for `4c2dd74` was created at 16:41:33Z, never started a single job, and was
# cancelled at 16:50:38Z when `bf6920b` arrived; `bf6920b` was then superseded the same way at
# 16:51:46Z. Both commits reached `main` with no verification at all, AFTER the cancel-in-progress
# fix had landed. `4c2dd74` is the commit that CONTAINS that fix.
#
# Giving each `main` commit its own group removes the queue entirely: nothing shares a group, so
# nothing is superseded, and every commit on the default branch is verified. The cost is real and
# accepted — several runners can be busy at once on a burst of pushes. On a branch the group is
# unchanged and supersession still applies, which is what makes a busy branch affordable.
#
# `ci-verification-integrity.test.ts` asserts both halves rather than trusting this comment.
concurrency:
  group: quality-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: ${{ matrix.app }} quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # One app must not hide the other: a red controller should still tell you whether the room is
      # green, because they are separate deployables and either can be fixed alone.
      fail-fast: false
      matrix:
        app:
          - controller
          - room

    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the repository pnpm version
        env:
          # Corepack asks before downloading a package manager and there is no TTY on a runner, so
          # the question is an immediate `exit 1` rather than a prompt. This does NOT weaken the
          # pin: the version still comes from `packageManager` and is verified below.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          # No version literal here, deliberately, and not even in a comment — `corepack install`
          # installs exactly what `package.json` pins. `ci-package-manager-pin.test.ts` fails if any
          # workflow reintroduces one, which is how the backend gate broke once already.
          #
          # RETRIED, because this step does not FAIL - it CRASHES, and the crash is not ours.
          #
          # 2026-08-23, `Frontend quality`, on the line `Adding pnpm@... to the cache...`:
          #
          #   AssertionError [ERR_ASSERTION]: assert(!this.paused)
          #       at Parser.finish (node:internal/deps/undici/undici:7388:9)
          #       at TLSSocket.onHttpSocketEnd (node:internal/deps/undici/undici:7827:34)
          #   Node.js v24.19.0
          #
          # That is Node's OWN bundled undici HTTP parser aborting the process when a TLS socket
          # ends while the parser is paused - a race in the download, not a bad pin, a bad lockfile
          # or anything this repository controls. It happened before a single line of our code ran,
          # and the job reported "exit code 1" with no test having executed.
          #
          # Retried rather than worked around, and the distinction matters: `corepack install` is
          # idempotent and reads the pin from `package.json` every time, so a second attempt asks
          # for exactly the same version. Nothing here weakens the pin - the comparison below still
          # runs, and a genuinely wrong version still fails the job on the first pass.
          #
          # NOT fixed by changing `.node-version`. The bug is in the runtime's bundled dependency
          # and picking a different Node to dodge it would be a guess: no evidence was read that
          # names a version where it is fixed, and that file governs the runtime every job uses.
          # Three attempts with a widening pause; a fourth failure is a real one and says so.
          attempt=1
          until corepack install; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=corepack install failed::three attempts; see the log above"
              exit 1
            fi
            echo "corepack install crashed or failed (attempt $attempt); retrying"
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=pnpm version mismatch::package.json pins $expected, the runner has $actual"
            exit 1
          fi
          echo "pnpm $actual, matching the packageManager pin"

      - name: Install dependencies from the frozen lockfile
        # `--frozen-lockfile` so a lockfile that disagrees with any `package.json` fails here rather
        # than being silently rewritten into something nobody reviewed.
        run: pnpm install --frozen-lockfile

      - name: Formatting
        working-directory: apps/${{ matrix.app }}
        # ADDED 2026-08-29, and it closed a real drift rather than a hypothetical one.
        #
        # Both apps have carried a `format:check` script for months and NOTHING RAN IT. That is what
        # an ungated script becomes - a convention a person has to remember - and it is the same
        # failure the `test:gates` note below records for the controller's eleven verifiers.
        #
        # The measurement, because the first number written here was the wrong one. Under the
        # scripts as they were declared, the drift was 11 files in the room and FIVE in the
        # controller. A repository-wide `prettier --check .` reported 88 for the controller, and
        # the gap between those two figures was the real finding: the controller's `format:check`
        # was scoped to `src/**`, `scripts/**/*.mjs`, `e2e/**` and root config, so seven `.js`
        # collectors under `scripts/` and every markdown file in the app were outside the gate it
        # declared. Both apps now check `.`, so the scope is one thing and `.prettierignore` is the
        # single place an exemption is recorded.
        #
        # Fixing the drift was NOT a blanket rewrite. 73 of the 88 were the decoded captures under
        # `docs/reference/`, which carry "every attribute verbatim" by their own first paragraph -
        # evidence, which `CLAUDE.md` says never to reformat. Those and the two generated
        # `docs/generated/` artifacts joined `.prettierignore` with the reason written beside them,
        # in the shape that file already uses; the 18 authored files and the room's 11 were
        # formatted.
        #
        # First, because it is the cheapest answer in the log and a formatting failure tells you
        # nothing about the code that a later step would explain better.
        run: pnpm run format:check

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: pnpm run lint

      - name: Type-check
        working-directory: apps/${{ matrix.app }}
        run: pnpm run check

      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        # `test:gates && test:unit` for the controller rather than `test`, and the split is
        # deliberate. Its `test` script chains fourteen verifiers, and exactly ONE of them —
        # `runtime:http` — makes live HTTP requests to a DEPLOYED preview and opens a PostgreSQL
        # connection. A gate that depends on a running deployment reports somebody else's outage as
        # this revision's failure, so that one stays out. The room's `test` is entirely local
        # (`privacy:verify`, `schema:verify`, `vitest run`), so it runs whole.
        #
        # THIS LINE USED TO RUN `test:unit` ALONE, and the comment here claimed the eleven verifiers
        # left out "run in the pre-merge full gate". Measured 2026-08-29: no workflow in this
        # repository runs the controller's `test`, so that gate was a person remembering. Eleven
        # verifiers — the schema pin, the migration and release checks, the evidence layout, the
        # privacy boundary, the font and room-login contracts — were enforced by nobody on a pull
        # request, which is the only verification a production deploy gets (`quality.yml:34`).
        #
        # `test:gates` is exactly those eleven: a provable PREFIX of `test`, which
        # `package-scripts-contract.test.ts` asserts so the two cannot drift apart. Everything is
        # local — each was run individually in a container with no PostgreSQL and no preview, and all
        # eleven passed — so nothing here can go red because something else is down.
        #
        # `test:counts:report` JOINED ON 2026-09-02, and it is the twelfth verifier found enforced by
        # nobody — the same defect as the eleven above, one round later. It is the LAST step of
        # `test`, so it can never be part of `test:gates`, which the contract asserts is a literal
        # PREFIX. Four documented totals in `ENGINEERING-SSOT.md`, `PRODUCTION-CUTOVER-PLAN.md` and
        # `SVELTE-CONFORMANCE-AUDIT.md` had drifted to 1077 tests against a suite of 1176 and 104
        # files against 116, and nothing anywhere went red. It reads the report `test:unit` has just
        # written rather than running Vitest a second time, so it costs nothing and must follow it.
        run: |
          if [ "${{ matrix.app }}" = "controller" ]; then
            pnpm run test:gates
            pnpm run test:unit
            pnpm run test:counts:report
          else
            pnpm run test
          fi

      - name: Build
        working-directory: apps/${{ matrix.app }}
        # Last, because it is the slowest and the least likely to fail alone: if lint, types and
        # units are green, a broken build is usually a config or dependency problem, and having the
        # three cheaper answers already in the log is what makes it diagnosable.
        run: pnpm run build

  controller-e2e:
    name: controller end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # THE HARNESS ALREADY EXISTED. NOTHING EVER RAN IT.
    #
    # `apps/controller` has carried `@playwright/test`, a `playwright.config.ts` with a `webServer`,
    # a `test:e2e` script and four written specs since 2026-08-10. `package.json`'s `quality` script
    # chains `test:e2e`, so it reads as covered — but `quality` is a LOCAL convenience script that no
    # workflow invokes, and grepping `.github/workflows/*` for `test:e2e` or `playwright` returned
    # nothing. Every browser assertion in this repository was, until this job, decorative.
    #
    # What that cost, measured on 2026-08-23 by running the suite against a throwaway cluster before
    # writing this. The first run reported 6 passed and 3 failed; repairing those three uncovered
    # three more behind them, because each failure had been masking the assertions after it. SIX in
    # total, and every one was the SPEC having rotted against a deliberate change the application had
    # made correctly and the spec had never seen —
    #
    #   `/^Manage$/`              an anchored pattern against an icon-prefixed accessible name. The
    #                             link was present and pointing at the right room the whole time.
    #   `#name` `#email`          the contact fields are `#contact-name`, `#contact-email` and
    #   `#message`                `#contact-message`.
    #   `getByRole('button')`     `Editable.svelte`'s closed trigger became an `<a href="">` on
    #                             2026-08-14, for a reason recorded in that file.
    #   `?tab=stats` and two      the tab is a PATH SEGMENT; `params.tab ?? 'users'`. The query form
    #   siblings                  is ignored, so two panes were asserted against the Users pane and
    #                             the page returned 200 throughout. The worst shape of the six.
    #   `yournamehere`            the vanity editor is a bootbox prompt, not an inline panel.
    #   the row's `.dropdown`     that wrapper is `btn-group mb-sm mr` + `data-menu-control`.
    #
    # NONE was an application defect, and every one would have been caught the day it appeared. That
    # is the argument for this job in one paragraph, so it is not a workflow anyone deletes as
    # redundant.
    #
    # One candidate application defect DID surface, and it is the reason `retries` exists in
    # `playwright.config.ts`: see the note there and `TODO.md` row 7.
    services:
      postgres:
        # The SAME pinned digest `backend-quality.yml` resolved on 2026-08-30, reused rather than
        # re-resolved: two jobs drifting onto different PostgreSQL builds is a difference nobody
        # would attribute correctly.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: proroom_e2e
          # Ephemeral, and deliberately in plain sight. This cluster lives for the length of one job,
          # is reachable only from it, and holds nothing but accounts the specs register themselves.
          # A repository secret here would imply it guards something.
          POSTGRES_PASSWORD: proroom_e2e_ephemeral_ci_password
          POSTGRES_DB: proroom_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proroom_e2e -d proroom_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CONTROL_PLANE_MODE: postgres
      DATABASE_URL: postgres://proroom_e2e:proroom_e2e_ephemeral_ci_password@127.0.0.1:5432/proroom_e2e
      # Nothing migrates this database by hand. `hooks.server.ts`'s `init` calls `ensureDatabase()`,
      # which takes the advisory lock and runs the numbered migrations under
      # `src/lib/server/db/migrations/` on first boot — the same path production takes on a cold
      # start. Verified locally: 16 tables in a cluster that began empty.
      #
      # THE FOUR VARIABLES BELOW ARE BLANK ON PURPOSE, and each blank is load-bearing:
      #
      #   RESEND_API_KEY / MAIL_FROM               absent, verification mail is neither sent nor
      #                                            ENFORCED, so a registered account can create a
      #                                            room. Set, every spec would stall on an unread
      #                                            inbox.
      #   PUBLIC_RECAPTCHA_SITE_KEY /              absent TOGETHER, `recaptchaEnabled()` is false and
      #   RECAPTCHA_SECRET_KEY                     `verifyRecaptcha` returns `{ ok, skipped }`. One
      #                                            without the other is a deliberate startup error.
      #                                            Set, registration would demand a token no
      #                                            headless browser can solve.
      #
      # A developer machine with a populated `.env` therefore CANNOT run this suite, which is part of
      # why nobody noticed it had rotted. The runner has no `.env` at all, so these are already
      # undefined; they are named here so the requirement is written down rather than inferred from
      # a passing job.
      RESEND_API_KEY: ''
      MAIL_FROM: ''
      PUBLIC_RECAPTCHA_SITE_KEY: ''
      RECAPTCHA_SECRET_KEY: ''
      SUPERADMIN_EMAILS: ''
      # Throwaway key material for a throwaway cluster. `responsive-contract.spec.ts` mints an API
      # key, and `api-key-secret.ts` REFUSES rather than degrades when it has no master secret — so
      # the alternative to a value here is a spec that cannot run, not one that runs unencrypted.
      ROOM_JWT_SECRET: ci-ephemeral-room-jwt-secret-not-a-real-credential
      API_KEY_ENCRYPTION_KEY: ci-ephemeral-api-key-encryption-key-not-a-real-credential

    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the repository pnpm version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          # No version literal, for the reason `ci-package-manager-pin.test.ts` asserts, and retried
          # for the reason the frontend job above records — the undici parser crash is a property of
          # the download, so it can strike any job that installs.
          attempt=1
          until corepack install; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=corepack install failed::three attempts; see the log above"
              exit 1
            fi
            echo "corepack install crashed or failed (attempt $attempt); retrying"
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=pnpm version mismatch::package.json pins $expected, the runner has $actual"
            exit 1
          fi
          echo "pnpm $actual, matching the packageManager pin"

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install the browser the harness is configured for
        working-directory: apps/controller
        # Chromium ALONE, because `playwright.config.ts` declares exactly one project and it is
        # `chromium`. Installing the full set would download two browsers no line of this repository
        # asks for. `--with-deps` because a bare runner has none of the shared libraries it needs.
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        working-directory: apps/controller
        # The config owns the server: it starts `vite dev`, waits for `/login`, and tears it down
        # when the run ends. `reuseExistingServer: false` means a port already answering is a loud
        # failure rather than a run that silently measured somebody else's application.
        run: pnpm run test:e2e

      - name: Preserve the traces and screenshots of a failing run
        # `if: failure()` and not `always()`: the config keeps artefacts only on failure
        # (`trace: 'retain-on-failure'`, `screenshot: 'only-on-failure'`), so a green run has nothing
        # to upload and this step would publish an empty archive every time.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: controller-e2e-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/controller/test-results/
          if-no-files-found: warn
          retention-days: 14

  room-e2e:
    name: room end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # THE ROOM HAD NO BROWSER, AND IT COST TWO PRODUCTION DEFECTS.
    #
    # `controller-e2e` above has driven a browser since 2026-08-23. The ROOM — the product surface,
    # forty-six components, three thousand unit assertions — had none, and every verification note in
    # `CHANGELOG.md` said so in the same words: "nothing was opened in a browser".
    #
    # The first run of this suite, on 2026-08-28, found two defects that had been shipping:
    #
    #   ReferenceError:      `createRoom` sat above ten page bindings its dependency thunks close
    #   every render 500     over. On the server a `$derived` evaluates immediately, so the root read
    #                        `deps.isPresenter()` while that binding was in its temporal dead zone.
    #                        Introduced 2026-08-17; ELEVEN DAYS of the room's own page answering 500.
    #
    #   two <title> tags     `app.html` carried `<title>PTRChat</title>` before `%sveltekit.head%`.
    #                        `document.title` is the FIRST title, so the browser tab never showed the
    #                        room's name — a wired setting whose entire purpose is that tab.
    #
    # Neither was visible to anything else here: both type-check, both lint clean, `svelte-check` is
    # silent on both, and every unit test constructs its subject with stubs that are already
    # initialised. That is the argument for this job, so it is not a workflow anyone deletes as
    # redundant.
    #
    # No PostgreSQL service, unlike the controller's job. The room fails closed without its
    # configuration, so `e2e/stub-controller.mjs` answers the two control-plane routes it needs — and
    # VERIFIES the capability bearer rather than accepting it, so the seam is exercised by every page
    # load. Bringing the real controller here would give every room-render failure two possible
    # causes; the controller's own behaviour is tested by the controller's own job.

    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the repository pnpm version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          # No version literal, for the reason `ci-package-manager-pin.test.ts` asserts, and retried
          # for the reason the frontend job above records — the undici parser crash is a property of
          # the download, so it can strike any job that installs.
          attempt=1
          until corepack install; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=corepack install failed::three attempts; see the log above"
              exit 1
            fi
            echo "corepack install crashed or failed (attempt $attempt); retrying"
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=pnpm version mismatch::package.json pins $expected, the runner has $actual"
            exit 1
          fi
          echo "pnpm $actual, matching the packageManager pin"

      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install the browser the harness is configured for
        working-directory: apps/room
        # Chromium ALONE — `playwright.config.ts` declares exactly one project. `--with-deps` because
        # a bare runner has none of the shared libraries it needs.
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end
        working-directory: apps/room
        # The config owns both servers: a stub control plane, then `vite build && node build`. The
        # BUILT server and not `vite dev`, because the room's page is compiled on first request under
        # dev and that one compile exceeded every bound this suite tried — measured, not assumed. It
        # is also what actually ships.
        run: pnpm run test:e2e

      - name: Preserve the traces and screenshots of a failing run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: room-e2e-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/room/test-results/
          if-no-files-found: warn
          retention-days: 14
