name: Frontend quality

# The gate the two applications never had.
#
# Until 2026-08-14 this repository ran exactly two workflows: `backend-quality.yml`, which gates
# Rust and skips itself when a revision does not touch `services/**`, and `smoke.yml`, which runs
# AFTER a deployment. Nothing ran lint, check, test or build for `apps/controller` or `apps/room` on
# a push or a pull request — and `main` auto-deploys, so a push is a production release.
#
# The absence was not merely untested, it was believed otherwise in writing: the controller's ESLint
# config ignored `apps/**` on the stated grounds that the room had "its own gate (the `room` job in
# `.github/workflows/quality.yml`)". This file is that job, created for the first time. What it
# would have caught, found by hand on the day it was written: the room had no ESLint at all, and a
# verification probe shipped a template literal terminated early by backticks inside a comment.

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on a BRANCH. Never on `main`.
#
# `cancel-in-progress: true` was unconditional here, and on a branch it is exactly right: pushing
# again makes the previous run irrelevant, and a slow job restarting from zero on every push means
# nothing is ever learned. On `main` it is the opposite, because a run on `main` is not a preview of
# a merge — it is the only verification a production deploy ever gets.
#
# What that cost, measured rather than argued. `060ba72` was pushed straight to `main`, broke the
# lint gate for every subsequent run, and its own verification run was CANCELLED when a PR merge
# landed two minutes later. The gate never checked the commit that broke it, and the next 8 runs
# failed for a reason nobody could attribute. Across the last 40 runs on `main`, 11 were `cancelled`
# — 27% — and that included EVERY `Backend quality` run in the 2026-08-15 sequence: 4a79203,
# c1ff436, 5f03e5f, 731d232, b267143, a84f20f, 41d8de6, ffa410d, 030a209, ed3b26f. The Rust and
# PostgreSQL security contracts on a multi-tenant fintech application were, in practice, unverified
# on the default branch.
#
# The expression evaluates to `false` only for `refs/heads/main`, so branch and pull_request runs
# keep cancelling as before and nothing gets slower except the default branch, which is the one
# place the answer matters more than the wall-clock.
#
# THE GROUP IS PER-COMMIT ON `main`, AND THAT SECOND HALF IS NOT DECORATION.
#
# `cancel-in-progress: false` alone was measured and found insufficient. It protects the run that is
# already EXECUTING, and that much worked — `34e6c09` started at 16:36:20Z and survived four
# subsequent pushes where every earlier backend run had been killed within minutes. But GitHub keeps
# only ONE pending run per concurrency group, so a newer arrival still cancels the QUEUED one. On
# 2026-08-15 the run for `4c2dd74` was created at 16:41:33Z, never started a single job, and was
# cancelled at 16:50:38Z when `bf6920b` arrived; `bf6920b` was then superseded the same way at
# 16:51:46Z. Both commits reached `main` with no verification at all, AFTER the cancel-in-progress
# fix had landed. `4c2dd74` is the commit that CONTAINS that fix.
#
# Giving each `main` commit its own group removes the queue entirely: nothing shares a group, so
# nothing is superseded, and every commit on the default branch is verified. The cost is real and
# accepted — several runners can be busy at once on a burst of pushes. On a branch the group is
# unchanged and supersession still applies, which is what makes a busy branch affordable.
#
# `ci-verification-integrity.test.ts` asserts both halves rather than trusting this comment.
concurrency:
  group: quality-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: ${{ matrix.app }} quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      # One app must not hide the other: a red controller should still tell you whether the room is
      # green, because they are separate deployables and either can be fixed alone.
      fail-fast: false
      matrix:
        app:
          - controller
          - room

    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository-pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the repository pnpm version
        env:
          # Corepack asks before downloading a package manager and there is no TTY on a runner, so
          # the question is an immediate `exit 1` rather than a prompt. This does NOT weaken the
          # pin: the version still comes from `packageManager` and is verified below.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          # No version literal here, deliberately, and not even in a comment — `corepack install`
          # installs exactly what `package.json` pins. `ci-package-manager-pin.test.ts` fails if any
          # workflow reintroduces one, which is how the backend gate broke once already.
          corepack install
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=pnpm version mismatch::package.json pins $expected, the runner has $actual"
            exit 1
          fi
          echo "pnpm $actual, matching the packageManager pin"

      - name: Install dependencies from the frozen lockfile
        # `--frozen-lockfile` so a lockfile that disagrees with any `package.json` fails here rather
        # than being silently rewritten into something nobody reviewed.
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/${{ matrix.app }}
        run: pnpm run lint

      - name: Type-check
        working-directory: apps/${{ matrix.app }}
        run: pnpm run check

      - name: Unit tests
        working-directory: apps/${{ matrix.app }}
        # `test:unit` for the controller rather than `test`, and the difference is deliberate. Its
        # `test` script chains fourteen verifiers, and one of them — `runtime:http` — makes live
        # HTTP requests to a DEPLOYED preview. A gate that depends on a running deployment reports
        # somebody else's outage as this revision's failure. The room's `test` is entirely local
        # (`privacy:verify`, `schema:verify`, `vitest run`), so it runs whole.
        #
        # The verifiers left out here are not unowned: they run in the pre-merge full gate. Naming
        # that boundary is the point — a green check on this workflow means lint, types, units and a
        # build, and does not claim to mean the evidence verifiers passed.
        run: |
          if [ "${{ matrix.app }}" = "controller" ]; then
            pnpm run test:unit
          else
            pnpm run test
          fi

      - name: Build
        working-directory: apps/${{ matrix.app }}
        # Last, because it is the slowest and the least likely to fail alone: if lint, types and
        # units are green, a broken build is usually a config or dependency problem, and having the
        # three cheaper answers already in the log is what makes it diagnosable.
        run: pnpm run build
