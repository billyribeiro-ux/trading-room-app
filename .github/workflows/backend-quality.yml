name: Backend quality

on:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on a BRANCH, never on `main` — the reasoning is in `quality.yml`, and this
# job is the one it cost the most. EVERY run of this workflow on `main` in the 2026-08-15 sequence
# was `cancelled` before it finished, so the Rust and PostgreSQL security contracts never actually
# verified a commit on the default branch. This is also the slowest workflow here, which is precisely
# why it was the one that always lost the race.
concurrency:
  group: backend-quality-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-postgres:
    name: Rust and PostgreSQL security contracts
    runs-on: ubuntu-24.04
    # The PostgreSQL/Rust suite and the clean auditable Docker rebuild are both
    # release gates. Keep one bounded job while allowing cold GitHub runners to
    # compile the native graph without a false timeout.
    timeout-minutes: 90

    services:
      postgres:
        # Official PostgreSQL 17 multi-architecture image resolved on 2026-08-30.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: ptr_clone
          POSTGRES_PASSWORD: ptr_clone_local_development_password
          POSTGRES_DB: ptr_clone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptr_clone -d ptr_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres-cross-cluster-control:
        # Independent same-version, same-database-name negative control. The
        # release attestor must reject owner/runtime URLs mixed across clusters.
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: ptr_clone
          POSTGRES_PASSWORD: ptr_clone_local_development_password
          POSTGRES_DB: ptr_clone
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ptr_clone -d ptr_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MIGRATE_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5432/ptr_clone
      # The decoded password contains both a quote and a backslash. This is a
      # regression contract for safe psql binding in the role provisioner.
      #
      # `tradingroom_app`, NOT `ptr_clone_app`, and the difference is the whole
      # reason 27 integration tests failed the first time this gate actually ran.
      #
      # TWO roles exist on the cluster and they are not interchangeable:
      #
      #   ptr_clone_app    the BASELINE role. `0001_baseline.sql` names it in 22 RLS
      #                    policies and every grant, and re-creates it - with the
      #                    placeholder password committed at its line 26 - if it is
      #                    absent. The baseline is byte-identical to the captured
      #                    schema of the original system and cannot be edited, so the
      #                    provisioning step below creates this role properly to stop
      #                    that branch ever running. Nothing connects as it.
      #
      #   tradingroom_app  the RUNTIME role, and what every connection here uses.
      #                    `db::migrate::EXPECTED_RUNTIME_ROLE`. Provisioned alongside
      #                    the baseline role, then granted parity with it - every
      #                    privilege and every RLS policy membership - by
      #                    `0009_provision_tradingroom_app.sql`.
      #
      # The role is ADDED, never renamed. An earlier `0009` renamed it and could not
      # work: PostgreSQL roles are cluster-global while the sqlx ledger is
      # per-database, so the second database migrated on one cluster met both names
      # and the migration refused by its own design. See `ops/naming-provenance.md`.
      #
      # Naming this `ptr_clone_app` once cost a wrong diagnosis worth recording: all
      # 27 tests died at `api/tests/support/mod.rs:92` with `28P01 password
      # authentication failed`. PostgreSQL reports a NONEXISTENT role to the client as
      # an authentication failure and logs the real reason ("Role does not exist")
      # only server-side. The password was never wrong.
      DATABASE_URL: postgres://tradingroom_app:ptr_app_%27%5C_local@127.0.0.1:5432/ptr_clone

    steps:
      - name: Check out the immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff a pull request against its base. `0` rather than a
          # guessed depth: a shallow clone silently produces an empty diff, which
          # would skip this gate on a backend change — the one failure mode this
          # step must not have.
          fetch-depth: 0
          persist-credentials: false

      # This gate compiles the Rust workspace, stands up two PostgreSQL clusters
      # and rebuilds the API image. It takes ~33 minutes, and it ran in full on
      # every pull request — including ones that touch no backend file at all.
      #
      # That is not merely slow. It is the release gate for `services/**`, and a
      # gate that always runs is a gate people learn to cancel; it also burns a
      # half-hour of Actions minutes per frontend change.
      #
      # So the JOB always runs and always reports — branch protection requires
      # this exact check name, and a path-filtered workflow would leave it
      # permanently "expected" and block every PR forever. What is conditional is
      # the WORK.
      #
      # Deliberately fail-open toward RUNNING: anything other than a pull request
      # whose diff provably touches none of these paths runs the full gate. Push
      # to main, merge_group and workflow_dispatch always run it, so nothing
      # reaches the default branch or the merge queue unverified.
      - name: Decide whether this revision touches the backend
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          # A PUSH is scoped the same way a pull request is, and that is new.
          #
          # Every non-pull_request event ran the full gate unconditionally, so every merge to `main`
          # spent the whole ~33-minute Rust and PostgreSQL suite whether or not it contained a single
          # backend file. Measured over the last 20 commits on `main`: 4 touched a backend path and
          # 16 did not, so 16 full runs verified a tree that was byte-identical to one already
          # verified. That is roughly 500 runner-minutes to re-prove nothing, and it is why this
          # workflow was always the one still running when the next push arrived.
          #
          # `merge_group` and `workflow_dispatch` deliberately keep the unconditional full gate.
          # The merge queue is the last check before code becomes `main`, and a manual dispatch is
          # someone asking for the real thing on purpose. Neither is on the hot path.
          #
          # It FAILS CLOSED. If the previous revision cannot be resolved — a first push, a force
          # push, a rewritten history, anything where `github.event.before` is absent or no longer an
          # object in this clone — the diff is unknowable and the full gate runs. A shallow or empty
          # diff must never be read as "no backend change"; that is the one failure mode this step
          # cannot have, which is also why the checkout above pins `fetch-depth: 0`.
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" >/dev/null 2>&1 || \
                git fetch --no-tags origin "${{ github.base_ref }}"
              base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
              ;;
            push)
              base="${{ github.event.before }}"
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                echo "reason=push whose previous revision cannot be resolved; running the full gate" >> "$GITHUB_OUTPUT"
                echo "backend=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "reason=event ${{ github.event_name }} always runs the full gate" >> "$GITHUB_OUTPUT"
              echo "backend=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          changed="$(git diff --name-only "$base" HEAD)"
          printf 'scoping against %s\nchanged files:\n%s\n' "$base" "$changed"
          # The workflow itself is in the list: a change to this file must be
          # proved by the gate it defines, or it could disable itself.
          # The verifier paths are `apps/controller/scripts/…`. They were written as
          # `scripts/…`, which is where they live in the sibling repository this gate
          # came from — so a change to any of the three matched NOTHING and skipped the
          # very gate that proves it. `scripts/build-api-release-evidence.sh` is the one
          # that genuinely sits at the root, and it is listed separately.
          if printf '%s\n' "$changed" | grep -qE '^(services/|ops/|apps/controller/scripts/(verify-backend|verify-api-release-artifact|verify-rust-advisories|cutover-(profile|room)-authority|verify-(profile|room)-cutover-e2e)|apps/controller/src/lib/server/db/migrations/|scripts/build-api-release-evidence\.sh|\.github/workflows/backend-quality\.yml)'; then
            echo "reason=backend paths changed" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no backend path in the diff" >> "$GITHUB_OUTPUT"
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a skipped backend gate
        if: steps.scope.outputs.backend != 'true'
        shell: bash
        run: |
          echo "::notice title=Backend gate skipped::${{ steps.scope.outputs.reason }}. The full Rust and PostgreSQL suite runs on every merge_group, every workflow_dispatch, and any pull request OR push to main whose diff touches services/**, ops/**, the backend verifiers, or this workflow. A push whose previous revision cannot be resolved also runs it."

      - name: Install the pinned Docker Buildx and BuildKit
        if: steps.scope.outputs.backend == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          name: api-release-builder
          version: v0.36.1
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Install the repository-pinned Node runtime
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate the repository pnpm version
        if: steps.scope.outputs.backend == 'true'
        env:
          # Corepack asks before downloading a package manager, and there is no TTY on a runner, so
          # the question is an immediate `exit 1` rather than a prompt. This is the documented way
          # to answer it in CI. It does NOT weaken the pin: the version still comes from
          # `packageManager` and is still verified below.
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          set -euo pipefail
          corepack enable
          # `corepack install` with no argument installs exactly what `package.json` pins. The
          # version is deliberately NOT written here — not even in a comment, which is why this one
          # names no number. That is the fix rather than a tidy-up.
          #
          # This step used to call `corepack prepare` with its own literal version, three days older
          # than the one in `package.json`. `--activate` only sets a DEFAULT, and inside a project
          # the pnpm shim always resolves `packageManager`, so the runner activated one version and
          # `pnpm --version` then asked for the other. Corepack tried to download it, and with no
          # TTY the confirmation prompt ended the job. Suppressing the prompt alone would only have
          # moved the failure one line down, onto an assertion comparing against a number the shim
          # was never going to print.
          #
          # `ci-package-manager-pin.test.ts` fails if any workflow reintroduces a version literal.
          #
          # RETRIED, because this step does not FAIL - it CRASHES, and the crash is not ours.
          #
          # 2026-08-23, `Frontend quality`, on the line `Adding pnpm@... to the cache...`:
          #
          #   AssertionError [ERR_ASSERTION]: assert(!this.paused)
          #       at Parser.finish (node:internal/deps/undici/undici:7388:9)
          #       at TLSSocket.onHttpSocketEnd (node:internal/deps/undici/undici:7827:34)
          #   Node.js v24.19.0
          #
          # That is Node's OWN bundled undici HTTP parser aborting the process when a TLS socket
          # ends while the parser is paused - a race in the download, not a bad pin, a bad lockfile
          # or anything this repository controls. It happened before a single line of our code ran,
          # and the job reported "exit code 1" with no test having executed.
          #
          # Retried rather than worked around, and the distinction matters: `corepack install` is
          # idempotent and reads the pin from `package.json` every time, so a second attempt asks
          # for exactly the same version. Nothing here weakens the pin - the comparison below still
          # runs, and a genuinely wrong version still fails the job on the first pass.
          #
          # NOT fixed by changing `.node-version`. The bug is in the runtime's bundled dependency
          # and picking a different Node to dodge it would be a guess: no evidence was read that
          # names a version where it is fixed, and that file governs the runtime every job uses.
          # Three attempts with a widening pause; a fourth failure is a real one and says so.
          attempt=1
          until corepack install; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=corepack install failed::three attempts; see the log above"
              exit 1
            fi
            echo "corepack install crashed or failed (attempt $attempt); retrying"
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual="$(pnpm --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=pnpm version mismatch::package.json pins $expected, the runner has $actual"
            exit 1
          fi
          echo "pnpm $actual, matching the packageManager pin"

      - name: Install the authority-conversion verifier dependencies
        if: steps.scope.outputs.backend == 'true'
        run: pnpm install --frozen-lockfile --filter proroom-control --ignore-scripts

      - name: Install and show the repository-pinned Rust toolchain
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: rustup show

      - name: Install the pinned Rust policy scanners
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2

      # The four steps below invoke the verifiers by PATH rather than through
      # `pnpm backend:*`. Those package scripts live in `apps/controller`, and the
      # repository root defines none of them, so every one of these ran as
      # `MODULE_NOT_FOUND` or "no such script" the first time this gate executed.
      # The scripts themselves resolve their own paths from `import.meta.url`, so
      # they are correct from any working directory.
      - name: Reject vulnerabilities and unreviewed RustSec warnings
        if: steps.scope.outputs.backend == 'true'
        run: node apps/controller/scripts/verify-rust-advisories.mjs

      # `cargo deny` from `services/` rather than `pnpm backend:licenses`, whose
      # `--manifest-path services/Cargo.toml` is relative to the repository root
      # and resolves to `apps/controller/services/…` when run from its own package.
      - name: Enforce Rust licenses, bans, and source registries
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: cargo deny --locked --all-features check licenses bans sources

      - name: Verify every migration byte and its forensic lineage
        if: steps.scope.outputs.backend == 'true'
        run: |
          node apps/controller/scripts/verify-backend.mjs --migrations-only
          node apps/controller/scripts/verify-backend-provenance.mjs

      - name: Prove PostgreSQL 17 is ready
        if: steps.scope.outputs.backend == 'true'
        env:
          PGPASSWORD: ptr_clone_local_development_password
        run: |
          test "$(psql -h 127.0.0.1 -U ptr_clone -d ptr_clone -Atc "SHOW server_version_num" | cut -c1-2)" = "17"

      - name: Provision the fail-closed runtime role
        if: steps.scope.outputs.backend == 'true'
        env:
          PGPASSWORD: ptr_clone_local_development_password
          POSTGRES_USER: ptr_clone
          POSTGRES_DB: ptr_clone
          POSTGRES_APP_USER: ptr_clone_app
          POSTGRES_APP_PASSWORD: "ptr_app_'\\_local"
          PGHOST: 127.0.0.1
        run: bash services/docker/postgres/10-provision-roles.sh

      - name: Provision the independent cross-cluster negative control
        if: steps.scope.outputs.backend == 'true'
        env:
          PGPASSWORD: ptr_clone_local_development_password
          POSTGRES_USER: ptr_clone
          POSTGRES_DB: ptr_clone
          POSTGRES_APP_USER: ptr_clone_app
          POSTGRES_APP_PASSWORD: "ptr_app_'\\_local"
          PGHOST: 127.0.0.1
          PGPORT: 5433
        run: bash services/docker/postgres/10-provision-roles.sh

      - name: Apply the immutable migration chain as database owner
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: cargo run --locked --release --bin migrate

      - name: Apply the same chain to the independent negative-control cluster
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        env:
          MIGRATE_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5433/ptr_clone
        run: cargo run --locked --release --bin migrate

      - name: Load the committed two-tenant fixture
        if: steps.scope.outputs.backend == 'true'
        env:
          PGPASSWORD: ptr_clone_local_development_password
        run: >-
          psql -h 127.0.0.1 -U ptr_clone -d ptr_clone -v ON_ERROR_STOP=1
          -f services/api/fixtures/seed.sql

      - name: Prove the profile authority conversion and guarded rollback
        if: steps.scope.outputs.backend == 'true'
        env:
          CUTOVER_TARGET_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5432/ptr_clone
        run: node apps/controller/scripts/verify-profile-cutover-e2e.mjs

      - name: Prove the room authority conversion and guarded rollback
        if: steps.scope.outputs.backend == 'true'
        env:
          CUTOVER_TARGET_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5432/ptr_clone
        run: node apps/controller/scripts/verify-room-cutover-e2e.mjs

      - name: Prove the room-settings authority conversion and guarded rollback
        if: steps.scope.outputs.backend == 'true'
        env:
          CUTOVER_TARGET_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5432/ptr_clone
        run: node apps/controller/scripts/verify-room-settings-cutover-e2e.mjs

      - name: Verify formatting
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: cargo fmt --all -- --check

      - name: Reject every Clippy warning across all targets
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: cargo clippy --locked --workspace --all-targets --features testing -- -D warnings

      - name: Run all Rust tests against real row-level security
        if: steps.scope.outputs.backend == 'true'
        working-directory: services
        run: cargo test --locked --workspace --features testing

      - name: Emit the redacted PostgreSQL release attestation
        if: steps.scope.outputs.backend == 'true'
        run: |
          umask 077
          install -d -m 0700 "release-evidence/api-${GITHUB_SHA}"
          cargo run --locked --manifest-path services/Cargo.toml \
            -p tradingroom-api --bin postgres-release-attestation -- --format json \
            > "release-evidence/api-${GITHUB_SHA}/postgres-release-attestation.json"
          jq --exit-status \
            '.attestation_version == 1 and .status == "pass"' \
            "release-evidence/api-${GITHUB_SHA}/postgres-release-attestation.json" \
            > /dev/null

      - name: Reject cross-cluster owner and runtime URL mixing
        if: steps.scope.outputs.backend == 'true'
        env:
          MIGRATE_DATABASE_URL: postgres://ptr_clone:ptr_clone_local_development_password@127.0.0.1:5432/ptr_clone
          # `tradingroom_app` for the same reason as the job-level URL above: the
          # 5433 cluster has the migration chain applied to it too (see "Apply the
          # same chain to the independent negative-control cluster"), so `0009` has
          # provisioned the runtime role there as well. Not renamed — ADDED beside
          # the baseline role, which is what makes the chain re-appliable at all.
          #
          # It matters MORE here than anywhere else. This step asserts a specific
          # failure — `[target_cluster_mismatch]` on stderr — and a connection that
          # died earlier on an auth error would also be a non-zero exit with empty
          # stdout, passing two of the three checks while proving nothing about
          # cross-cluster mixing. The grep is what stops that, and it would have
          # started failing here rather than reporting a false pass.
          DATABASE_URL: postgres://tradingroom_app:ptr_app_%27%5C_local@127.0.0.1:5433/ptr_clone
        run: |
          negative_stdout="${RUNNER_TEMP}/postgres-cross-cluster.stdout"
          negative_stderr="${RUNNER_TEMP}/postgres-cross-cluster.stderr"
          set +e
          cargo run --locked --manifest-path services/Cargo.toml \
            -p tradingroom-api --bin postgres-release-attestation -- --format json \
            > "${negative_stdout}" 2> "${negative_stderr}"
          negative_status=$?
          set -e
          test "${negative_status}" -ne 0
          test ! -s "${negative_stdout}"
          grep --fixed-strings '[target_cluster_mismatch]' "${negative_stderr}" > /dev/null

      - name: Verify the release-artifact policy and immutable tool pins
        if: steps.scope.outputs.backend == 'true'
        run: node apps/controller/scripts/verify-api-release-artifact.mjs --verify-contract

      - name: Build and attest the registry-credential-free API release artifact
        if: steps.scope.outputs.backend == 'true'
        run: bash scripts/build-api-release-evidence.sh

      - name: Preserve API image, SBOM, and vulnerability evidence
        # `always()` so the evidence survives a FAILING gate, which is when it is
        # most worth reading — combined with the scope check rather than replaced
        # by it, so a skipped gate does not upload an empty artifact.
        if: always() && steps.scope.outputs.backend == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/api-${{ github.sha }}/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30
